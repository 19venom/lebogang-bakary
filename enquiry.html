<!DOCTYPE html>
<html lang="en">
<head>
    <title>Make an Enquiry | Lebogang's Bakery</title>
    <meta name="description"
    content="Enquire about custom cakes, bakery products,
    prices and availability at Lebogang's Bakery.">
    <style>
        /* Shared Bakery Theme Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #fdfbf7; color: #4a3e3d; line-height: 1.6; }
        
        header { background-color: #6d4c41; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #f5f5f5; text-decoration: none; margin-left: 20px; font-weight: bold; }
        nav a:hover, nav a.active { color: #ffcc80; text-decoration: underline; }

        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .intro-block { text-align: center; margin-bottom: 40px; }
        .intro-block h2 { color: #5d4037; font-size: 2.3rem; margin-bottom: 10px; }
        
        /* Form Card Container Layout */
        .enquiry-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 5px solid #8d6e63; }
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 250px; display: flex; flex-direction: column; }
        
        label { margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; color: #5d4037; }
        input, select, textarea { padding: 12px; border: 1px solid #d7ccc8; border-radius: 4px; font-size: 1rem; color: #4a3e3d; background-color: #fafafa; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #8d6e63; background-color: #fff; }
        
        /* Radio Button Grid Options */
        .radio-group { display: flex; gap: 20px; padding: 10px 0; }
        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .radio-option input { width: auto; cursor: pointer; }

        /* Submit Interactive Button */
        .submit-btn { background-color: #8d6e63; color: white; border: none; padding: 15px; font-size: 1.1rem; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.3s; margin-top: 10px; }
        .submit-btn:hover { background-color: #6d4c41; }
        
        footer { text-align: center; padding: 30px; background-color: #3e2723; color: #d7ccc8; margin-top: 60px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Header Navigation Section -->
    <header>
        <h1>Sweet Slice Bakery</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Our Menu</a>
            <a href="enquiry.html" class="active">Custom Order Enquiry</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Page Overview Header -->
        <section class="intro-block">
            <h2>Custom Order & Event Enquiries</h2>
            <p>Planning an event, wedding, or need a large order? Complete this request layout form to get a personalized quote within 24 hours.</p>
        </section>

        <!-- Main Enquiry Container Card -->
        <section class="enquiry-card">
            <form id="bakeryEnquiryForm" onsubmit="submitEnquiry(event)">
                
                <!-- Row 1: Primary Contact Info -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="clientName">Full Name:</label>
                        <input type="text" id="clientName" required placeholder="E.g. Sarah Jacobs">
                    </div>
                    <div class="form-group">
                        <label for="clientPhone">Contact Number:</label>
                        <input type="tel" id="clientPhone" required placeholder="E.g. 082 123 4567">
                    </div>
                </div>

                <!-- Row 2: Secondary Contact & Date Selection -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="clientEmail">Email Address:</label>
                        <input type="email" id="clientEmail" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label for="eventDate">Required Collection Date:</label>
                        <input type="date" id="eventDate" required>
                    </div>
                </div>

                <!-- Row 3: Product Category Selection Menu -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="orderType">What are you looking to order?</label>
                        <select id="orderType" required>
                            <option value="" disabled selected>-- Select an option --</option>
                            <option value="custom-cake">Custom Birthday / Wedding Cake</option>
                            <option value="cupcake-platter">Cupcake Platter (Bulk)</option>
                            <option value="savory-catering">Savory Pastries / Catering Platters</option>
                            <option value="wholesale">Wholesale Bread Supply</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="guestCount">Estimated Serving Size / Servings Needed:</label>
                        <input type="number" id="guestCount" min="5" placeholder="E.g. 25 people">
                    </div>
                </div>

                <!-- Service Style Configuration Selection -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Fulfillment Method:</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="fulfillment" value="collection" checked> 🏪 In-store Collection
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="fulfillment" value="delivery"> 🚚 Doorstep Delivery
                        </label>
                    </div>
                </div>

                <!-- Open Detailed Input Box -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="designDetails">Design Ideas, Flavors, or Dietary Requirements:</label>
                    <textarea id="designDetails" rows="5" required placeholder="Describe your theme, preferred flavors (e.g. Vanilla, Chocolate Choc-chip), or any dietary preferences like eggless or gluten-free..."></textarea>
                </div>

                <!-- Interactive Button Submission Event -->
                <button type="submit" class="submit-btn">Submit Quote Request</button>
            </form>
        </section>
    </main>

    <!-- Unified Footer Layout -->
    <footer>
        <p>&copy; 2026 Sweet Slice Bakery. All rights reserved.</p>
    </footer>

    <!-- Form Event Handling Notification Block -->
    <script>
        function submitEnquiry(event) {
            event.preventDefault();
            const clientName = document.getElementById('clientName').value;
            const orderType = document.getElementById('orderType').options[document.getElementById('orderType').selectedIndex].text;
            
            // Displays a summary notification dynamically to the client 
            alert(`Thank you, ${clientName}!\nYour quote enquiry for a "${orderType}" has been successfully logged. Our head baker will inspect your request guidelines and email you details shortly.`);
            
            document.getElementById('bakeryEnquiryForm').reset();
        }
    </script>

</body>
</html>
